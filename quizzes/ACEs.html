<style>

  --ace:#e3a59c; --ace-soft:#3a2523; --exp:#9fbbd6; --exp-soft:#22303c;

}}
:root[data-theme="dark"]{
  --bg:#151918; --panel:#1d2220; --panel-hi:#242a28; --ink:#e5e9e4; --muted:#a3ada7; --faint:#7b857f;

  --ace:#e3a59c; --ace-soft:#3a2523; --exp:#9fbbd6; --exp-soft:#22303c;

*{box-sizing:border-box}

.score .n small{font-family:var(--f-mono);font-size:.85rem;font-weight:400;color:var(--muted)}
.score .band{font-size:.88rem;color:var(--muted)}
.ledger{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:620px){.ledger{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.col h4{margin:0 0 4px;font:500 .74rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c)}

<script>
(function(){
"use strict";

/* ---------- response sets (native scales preserved) ---------- */
const SETS = {
  YN:   [["Yes","yes"],["No","no"],["Don't know / not sure","dk",1],["Prefer not to answer","pna",1]],
  SEP:  [["Yes","yes"],["No","no"],["Parents were not married","nm"],["Don't know / not sure","dk",1],["Prefer not to answer","pna",1]],
  F3:   [["Never","never"],["Once","once"],["More than once","more"],["Don't know / not sure","dk",1],["Prefer not to answer","pna",1]],
  T5:   [["Never","never"],["A little of the time","little"],["Some of the time","some"],["Most of the time","most"],["All of the time","all"],["Don't know / not sure","dk",1],["Prefer not to answer","pna",1]],
  YN2:  [["Yes","yes"],["No","no"],["Prefer not to answer","pna",1]],
  O5:   [["Never","never"],["Rarely","rarely"],["Sometimes","sometimes"],["Often","often"],["Always","always"],["Prefer not to answer","pna",1]],
  P5:   [["Never","never"],["Rarely","rarely"],["Sometimes","sometimes"],["Usually","usually"],["Always","always"],["Prefer not to answer","pna",1]],
  P5HS: [["Never","never"],["Rarely","rarely"],["Sometimes","sometimes"],["Usually","usually"],["Always","always"],["Did not attend high school / home-schooled","na",1],["Prefer not to answer","pna",1]]
};

const PARTS = {
  ace:{label:"At home", n:1, lede:"These questions come from the CDC's Behavioral Risk Factor Surveillance System ACE module, word for word. All of them refer to the time before you were 18. You can skip any question."},
  exp:{label:"Beyond the home", n:2, lede:"The original ACE study looked only inside the household. These questions cover adversity in the wider world a child grows up in: the neighborhood, school, and community. Still before age 18."},
  pce:{label:"What held", n:3, lede:"The last seven questions ask about the good things: the people and places that held you up. Adversity is half the picture; these are the other half."}
};

/* ---------- item bank ---------- */
const ITEMS = [
  // Part 1: BRFSS ACE module 2021–current, verbatim (U.S. federal work, public domain). Item 6 typo "you parents" corrected.
  {id:"B1", part:"ace", set:"YN", text:"Did you live with anyone who was depressed, mentally ill, or suicidal?"},
  {id:"B2", part:"ace", set:"YN", text:"Did you live with anyone who was a problem drinker or alcoholic?"},
  {id:"B3", part:"ace", set:"YN", text:"Did you live with anyone who used illegal street drugs or who abused prescription medications?"},
  {id:"B4", part:"ace", set:"YN", text:"Did you live with anyone who served time or was sentenced to serve time in a prison, jail, or other correctional facility?"},
  {id:"B5", part:"ace", set:"SEP", text:"Were your parents separated or divorced?"},
  {id:"B6", part:"ace", set:"F3", text:"How often did your parents or adults in your home ever slap, hit, kick, punch or beat each other up?"},
  {id:"B7", part:"ace", set:"F3", text:"Not including spanking, (before age 18), how often did a parent or adult in your home ever hit, beat, kick, or physically hurt you in any way?"},
  {id:"B8", part:"ace", set:"F3", text:"How often did a parent or adult in your home ever swear at you, insult you, or put you down?"},
  {id:"B9", part:"ace", set:"F3", text:"How often did anyone at least 5 years older than you or an adult, ever touch you sexually?"},
  {id:"B10",part:"ace", set:"F3", text:"How often did anyone at least 5 years older than you or an adult, try to make you touch them sexually?"},
  {id:"B11",part:"ace", set:"F3", text:"How often did anyone at least 5 years older than you or an adult, force you to have sex?"},
  {id:"B12",part:"ace", set:"T5", text:"For how much of your childhood was there an adult in your household who made you feel safe and protected?"},
  {id:"B13",part:"ace", set:"T5", text:"For how much of your childhood was there an adult in your household who tried hard to make sure your basic needs were met?"},
  // Part 2: original items mapped to Philadelphia Expanded ACE + NSCH domains (clean-room)
  {id:"E1", part:"exp", set:"F3", text:"Before you were 18, how often did you see or hear someone being shot, stabbed, or badly beaten outside your home — in your neighborhood, at school, or elsewhere?"},
  {id:"E2", part:"exp", set:"F3", text:"Before you were 18, how often were you treated badly or unfairly because of your race, ethnicity, religion, sexual orientation, disability, or another part of who you are?"},
  {id:"E3", part:"exp", set:"O5", text:"How often did you feel unsafe in the neighborhood where you lived?"},
  {id:"E4", part:"exp", set:"O5", text:"How often could you count on adults in your neighborhood to look out for the kids around them?"},
  {id:"E5", part:"exp", set:"F3", text:"How often were you bullied by other kids or teens — hit, threatened, mocked, shut out, or harassed, in person or online?"},
  {id:"E6", part:"exp", set:"YN2", text:"Did you ever live in foster care, in a group home, or with relatives because a court or agency placed you there?"},
  {id:"E7", part:"exp", set:"O5", text:"How often was it very hard for your household to cover basics like food, rent, or utilities?"},
  {id:"E8", part:"exp", set:"YN2", text:"Did a parent or main caregiver die while you were growing up?"},
  // Part 3: Positive Childhood Experiences (Bethell et al., 2019; Wisconsin BRFS 2015)
  {id:"P1", part:"pce", set:"P5", text:"Before you were 18, how often did you feel able to talk to your family about your feelings?"},
  {id:"P2", part:"pce", set:"P5", text:"How often did you feel your family stood by you during difficult times?"},
  {id:"P3", part:"pce", set:"P5", text:"How often did you enjoy taking part in community traditions?"},
  {id:"P4", part:"pce", set:"P5HS", text:"How often did you feel a sense of belonging in high school?"},
  {id:"P5", part:"pce", set:"P5", text:"How often did you feel supported by friends?"},
  {id:"P6", part:"pce", set:"P5", text:"How often were there at least two adults, other than your parents, who took a genuine interest in you?"},
  {id:"P7", part:"pce", set:"P5", text:"How often did you feel safe and protected by an adult in your home?"}
];

/* ---------- category definitions (scoring keys) ---------- */
const any = (ids, codes) => a => ids.some(id => codes.includes(a[id]));
const CATS = {
  ace:[
    {id:"mental",    label:"Household mental illness", grp:"Household", ids:["B1"], hit:any(["B1"],["yes"])},
    {id:"substance", label:"Household substance use",  grp:"Household", ids:["B2","B3"], hit:any(["B2","B3"],["yes"])},
    {id:"incarc",    label:"Incarcerated household member", grp:"Household", ids:["B4"], hit:any(["B4"],["yes"])},
    {id:"separation",label:"Parental separation or divorce", grp:"Household", ids:["B5"], hit:any(["B5"],["yes"])},
    {id:"dv",        label:"Violence between adults", grp:"Abuse", ids:["B6"], hit:any(["B6"],["once","more"])},
    {id:"physical",  label:"Physical abuse", grp:"Abuse", ids:["B7"], hit:any(["B7"],["once","more"])},
    {id:"emotional", label:"Emotional abuse", grp:"Abuse", ids:["B8"], hit:any(["B8"],["once","more"])},
    {id:"sexual",    label:"Sexual abuse", grp:"Sexual", ids:["B9","B10","B11"], hit:any(["B9","B10","B11"],["once","more"])},
    {id:"eneglect",  label:"Emotional neglect", grp:"Neglect", ids:["B12"], hit:any(["B12"],["never","little"])},
    {id:"pneglect",  label:"Physical neglect", grp:"Neglect", ids:["B13"], hit:any(["B13"],["never","little"])}
  ],
  exp:[
    {id:"witness",  label:"Witnessed community violence", ids:["E1"], hit:any(["E1"],["once","more"])},
    {id:"discrim",  label:"Discrimination", ids:["E2"], hit:any(["E2"],["once","more"])},
    {id:"neighbor", label:"Unsafe or unsupportive neighborhood", ids:["E3","E4"], hit:a => ["often","always"].includes(a.E3) || ["never","rarely"].includes(a.E4)},
    {id:"bullied",  label:"Repeated bullying", ids:["E5"], hit:any(["E5"],["more"])},
    {id:"foster",   label:"Out-of-home placement", ids:["E6"], hit:any(["E6"],["yes"])},
    {id:"hardship", label:"Economic hardship", ids:["E7"], hit:any(["E7"],["often","always"])},
    {id:"loss",     label:"Death of a parent or caregiver", ids:["E8"], hit:any(["E8"],["yes"])}
  ],
  pce:[
    {id:"talk",    label:"Could talk to family about feelings", ids:["P1"]},
    {id:"stood",   label:"Family stood by me in hard times", ids:["P2"]},
    {id:"trad",    label:"Enjoyed community traditions", ids:["P3"]},
    {id:"belong",  label:"Belonged in high school", ids:["P4"]},
    {id:"friends", label:"Supported by friends", ids:["P5"]},
    {id:"adults",  label:"Two non-parent adults who cared", ids:["P6"]},
    {id:"safe",    label:"Felt safe and protected at home", ids:["P7"]}
  ].map(c => Object.assign(c,{hit:any(c.ids,["usually","always"])}))
};

/* ---------- bands ---------- */
function aceBand(n){ return n===0?{k:"none",t:"No ACEs reported"}: n===1?{k:"one",t:"One ACE"}: n<=3?{k:"some",t:"2–3 ACEs"}:{k:"high",t:"4 or more ACEs"}; }
function expBand(n){ return n===0?{k:"none",t:"None reported"}: n<=2?{k:"some",t:"1–2 expanded ACEs"}:{k:"high",t:"3 or more expanded ACEs"}; }
function pceBand(n){ return n<=2?{k:"low",t:"0–2 PCEs"}: n<=5?{k:"mid",t:"3–5 PCEs"}:{k:"high",t:"6–7 PCEs"}; }

/* ---------- pure scoring ---------- */
const T5V = {never:0,little:1,some:2,most:3,all:4};
const P5V = {never:0,rarely:1,sometimes:2,usually:3,always:4};
function score(a){
  const out = {};
  for (const lens of ["ace","exp","pce"]){
    const cats = CATS[lens].map(c => {
      const answered = c.ids.filter(id => a[id] !== undefined && a[id] !== "pna");
      return {id:c.id,label:c.label,grp:c.grp,on:!!c.hit(a),skipped:answered.length===0};
    });
    out[lens] = {cats, n:cats.filter(c=>c.on).length, max:cats.length,
      skipped: ITEMS.filter(i=>i.part===lens && a[i.id]==="pna").length};
  }
  out.ace.band = aceBand(out.ace.n); out.exp.band = expBand(out.exp.n); out.pce.band = pceBand(out.pce.n);
  const g = k => out.ace.cats.filter(c=>c.grp===k);
  out.ace.groups = ["Household","Abuse","Sexual","Neglect"].map(k=>({k,n:g(k).filter(c=>c.on).length,max:g(k).length}));
  // Consistency: B12 and P7 ask about the same thing on different scales
  out.flags = {};
  if (a.B12 in T5V && a.P7 in P5V && Math.abs(T5V[a.B12]-P5V[a.P7]) >= 3) out.flags.safeMismatch = true;
  out.flags.hsNA = a.P4 === "na";
  out.flags.anySkipped = out.ace.skipped + out.exp.skipped + out.pce.skipped > 0;
  out.flags.sexualSkipped = ["B9","B10","B11"].some(id => a[id]==="pna");
  out.combined = out.ace.n + out.exp.n;
  return out;
}

function quadrant(s){
  const hiA = s.ace.n >= 4, midA = s.ace.n >= 1 && s.ace.n <= 3;
  const p = s.pce.band.k;
  if (hiA && p==="high") return {k:"buffered-high", t:"Heavy adversity, strong buffers"};
  if (hiA && p==="mid")  return {k:"partial-high",  t:"Heavy adversity, partial buffers"};
  if (hiA)               return {k:"unbuffered",    t:"Heavy adversity, few buffers"};
  if (midA && p==="low") return {k:"thin",          t:"Some adversity, few buffers"};
  if (midA)              return {k:"buffered-mid",  t:"Some adversity, buffered"};
  if (p==="low")         return {k:"quiet",         t:"Little adversity, few buffers"};
  return {k:"steady", t:"Little adversity, solid buffers"};
}

const READINGS = {
  "buffered-high":"You reported four or more household ACEs and six or seven positive experiences. In Bethell's statewide data, high PCE counts were linked to lower odds of adult depression and poor mental health at every ACE level, including the highest. Both things are true of your childhood: a lot went wrong, and real people and places held you anyway. Those buffers are worth naming specifically, because they are often the template for what helps now.",
  "partial-high":"You reported four or more household ACEs alongside a moderate number of positive experiences. Some protection was present, unevenly. Look at which PCE tiles are filled and which are empty: the empty ones often point to what was missing at the time, and to what adults with this pattern most often find themselves building later (a trusted friend, a mentor, a community).",
  "unbuffered":"You reported four or more household ACEs and two or fewer positive experiences. This is the combination the research flags most clearly: a lot of adversity with little to absorb it. That is a description of what a child was given, not a forecast about who that child became. If any of it still weighs on you, this is the profile where talking to a trauma-informed professional tends to help most.",
  "thin":"You reported one to three household ACEs and few positive experiences. The ACE count alone looks moderate, but the buffer side is thin. Bethell's data suggest the absence of good things carries weight of its own, so this pattern can feel heavier than the ACE number implies.",
  "buffered-mid":"You reported one to three household ACEs alongside a moderate-to-strong set of positive experiences. This is the most common shape in population surveys: some adversity, met with some protection.",
  "quiet":"You reported no household ACEs but two or fewer positive experiences. Nothing on the standard ACE list happened, yet much of what helps a child feel connected was missing. Bethell found that adults with no ACEs but few PCEs still had notably lower rates of feeling emotionally supported as adults. The ACE score would call this a clean childhood; the PCE score says otherwise, and that gap is often hard to name.",
  "steady":"You reported no household ACEs and a moderate-to-strong set of positive experiences. By both measures this is a well-supported childhood. The expanded panel may still show adversity from outside the home, which the standard ACE score does not count."
};

function themeBtn(){

}
function curTheme(){
  const r = document.documentElement.getAttribute("data-theme");
  if (r) return r;
  try { return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch(e){ return "light"; }
}
function bindTheme(){
  const b = document.getElementById("themeBtn"); if(!b) return;
  b.onclick = () => {
    const nt = curTheme()==="dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", nt);
    const n = nt==="dark" ? "Light" : "Dark";

/* ---------- screens ---------- */

function renderQ(){

function choose(code){
  const it = ITEMS[S.i]; S.a[it.id] = code;

function back(){

/* ---------- results ---------- */
function ledgerCol(lens, s, title, c, cs){
  return `<div class="col" style="--c:var(${c});--cs:var(${cs})"><h4>${title} · ${s[lens].n}/${s[lens].max}</h4>
  ${s[lens].cats.map(x=>`<div class="tile${x.on?" on":""}${x.skipped?" skip":""}" data-cat="${x.id}"><span>${esc(x.label)}</span><span class="mk">${x.on?"●":x.skipped?"skipped":"○"}</span></div>`).join("")}</div>`;
}

function gridSVG(s){
  // x: ACE 0–10, y: PCE 0–7. Bands shaded by ACE band columns.
  const W=440,H=260,L=40,B=34,T=12,R=12, cw=(W-L-R)/11, ch=(H-T-B)/8;
  let g="";
  for(let x=0;x<=10;x++) for(let y=0;y<=7;y++){
    const fill = x>=4 ? "var(--ace-soft)" : "var(--track)";
    const op = y>=6 ? .55 : y>=3 ? .8 : 1;
    g+=`<rect x="${L+x*cw+1}" y="${T+(7-y)*ch+1}" width="${cw-2}" height="${ch-2}" fill="${fill}" opacity="${op}" rx="2"/>`;
  }
  // PCE band separators
  [3,6].forEach(y=>{ const yy=T+(8-y)*ch; g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--pce)" stroke-dasharray="3 3" stroke-width="1"/>`; });
  const xx=L+4*cw; g+=`<line x1="${xx}" x2="${xx}" y1="${T}" y2="${H-B}" stroke="var(--ace)" stroke-dasharray="3 3" stroke-width="1"/>`;
  for(let x=0;x<=10;x++) g+=`<text x="${L+x*cw+cw/2}" y="${H-B+14}" text-anchor="middle">${x}</text>`;
  for(let y=0;y<=7;y++) g+=`<text x="${L-8}" y="${T+(7-y)*ch+ch/2+3}" text-anchor="end">${y}</text>`;
  g+=`<text x="${L+(W-L-R)/2}" y="${H-4}" text-anchor="middle">ACE score (at home) →</text>`;
  g+=`<text transform="translate(11 ${T+(H-T-B)/2}) rotate(-90)" text-anchor="middle">PCE score →</text>`;
  const cx=L+s.ace.n*cw+cw/2, cy=T+(7-s.pce.n)*ch+ch/2;
  g+=`<circle cx="${cx}" cy="${cy}" r="9" fill="var(--syn)" stroke="var(--panel-hi)" stroke-width="2" id="you"/>`;
  return `<div class="gridwrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;min-width:320px" role="img" aria-label="Your position: ACE ${s.ace.n}, PCE ${s.pce.n}">${g}</svg></div>`;
}

function catBars(s){
  return `<div class="bars">${s.ace.groups.map(g=>`<div class="bar" style="--c:var(--ace)"><span>${g.k==="Household"?"Household dysfunction":g.k==="Abuse"?"Violence &amp; emotional/physical abuse":g.k==="Sexual"?"Sexual abuse":"Neglect"}</span><div class="trk"><i style="width:${g.n/g.max*100}%"></i></div><span class="tag">${g.n}/${g.max}</span></div>`).join("")}</div>`;
}

function flagsHTML(s){
  let h="";
  if (s.flags.safeMismatch) h+=`<div class="flag">Two questions asked about the same thing: whether an adult at home made you feel safe and protected. Your answers to them sit far apart on the scale. That can happen when childhood had distinct periods, or when the wording landed differently. It may be worth a second look.</div>`;
  if (s.flags.anySkipped) h+=`<div class="flag">You chose <em>Prefer not to answer</em> on ${s.ace.skipped+s.exp.skipped+s.pce.skipped} question(s). Following CDC convention, a skipped question does not count toward a score, so your totals may be lower than they would otherwise be.</div>`;
  return h;
}

const ACE_TEXT = {
  none:"You reported none of the ten standard ACE categories. In CDC surveillance data, roughly four in ten U.S. adults report none.",
  one:"You reported one of the ten categories. About six in ten U.S. adults report at least one ACE, so a single ACE is common.",
  some:"You reported two or three categories. ACEs tend to cluster: when one is present, others often are too, which is why the count matters more than any single item.",
  high:"You reported four or more categories. Four is the threshold used in the original Kaiser–CDC study, where risk for a range of adult health outcomes rose noticeably. Nearly one in six U.S. adults report four or more. These are population odds, not a personal forecast."
};
const EXP_TEXT = {
  none:"You reported none of the community-level adversities.",
  some:"You reported one or two community-level adversities. In Philadelphia's survey, many adults with no conventional ACEs still had expanded ones, which is why this panel exists.",

};
const PCE_TEXT = {

};

function renderResults(){
  const s = score(S.a), q = quadrant(s);
  const accent = {syn:"syn",ace:"ace",exp:"exp",pce:"pce",apx:"syn"}[S.tab];
  document.body.dataset.accent = accent;
  const tabs = [["syn","Overview"],["ace","At home"],["exp","Beyond the home"],["pce","What held"],["apx","Appendix"]];
  let body="";
  if (S.tab==="syn"){
    body = `
    <div class="scores">
      <div class="score" style="--c:var(--ace)"><span class="eyebrow">ACE · at home</span><span class="n" id="aceN">${s.ace.n}<small> /10</small></span><span class="band">${s.ace.band.t}</span></div>
      <div class="score" style="--c:var(--exp)"><span class="eyebrow">Beyond the home</span><span class="n" id="expN">${s.exp.n}<small> /7</small></span><span class="band">${s.exp.band.t}</span></div>
      <div class="score" style="--c:var(--pce)"><span class="eyebrow">PCE · what held</span><span class="n" id="pceN">${s.pce.n}<small> /7</small></span><span class="band">${s.pce.band.t}</span></div>
    </div>
    <section class="panel stack"><h3>The ledger</h3><p class="muted" style="font-size:.9rem">Filled tiles are categories you reported. Adversity on the left, protection on the right.</p>
      <div class="ledger">${ledgerCol("ace",s,"At home","--ace","--ace-soft")}${ledgerCol("exp",s,"Beyond","--exp","--exp-soft")}${ledgerCol("pce",s,"What held","--pce","--pce-soft")}</div>
    </section>
    <section class="stack"><span class="eyebrow">Adversity against buffers</span><h3 id="quad">${q.t}</h3>
      ${gridSVG(s)}
      <div class="reading"><p id="reading">${READINGS[q.k]}</p></div>
    </section>
    ${flagsHTML(s)}`;
  } else if (S.tab==="ace"){
    body = `<div class="reading"><span class="eyebrow">CDC BRFSS ACE module · 0–10</span><h2>${s.ace.n} of 10 · ${s.ace.band.t}</h2><p>${ACE_TEXT[s.ace.band.k]}</p></div>
    ${catBars(s)}
    <p class="muted" style="font-size:.9rem;max-width:62ch">The groupings follow the three factors CDC researchers found in the BRFSS items (Ford et al., 2014), with the two neglect items, added later, shown separately.</p>
    <div class="ledger" style="grid-template-columns:1fr">${ledgerCol("ace",s,"Categories","--ace","--ace-soft")}</div>
    ${s.ace.n>=4 || s.ace.cats.find(c=>c.id==="sexual").on ? `<div class="panel">${SUPPORT}</div>`:""}`;
  } else if (S.tab==="exp"){
    body = `<div class="reading"><span class="eyebrow">Expanded ACEs · 0–7</span><h2>${s.exp.n} of 7 · ${s.exp.band.t}</h2><p>${EXP_TEXT[s.exp.band.k]}</p>
    <p class="muted">Combined with the household score, you reported <b>${s.combined}</b> of 17 adversity categories. No published norms exist for that combined number; it is shown for your own reference.</p></div>
    <div class="ledger" style="grid-template-columns:1fr">${ledgerCol("exp",s,"Categories","--exp","--exp-soft")}</div>`;
  } else if (S.tab==="pce"){
    body = `<div class="reading"><span class="eyebrow">Positive Childhood Experiences · 0–7</span><h2>${s.pce.n} of 7 · ${s.pce.band.t}</h2><p>${PCE_TEXT[s.pce.band.k]}</p>
    <p>A PCE counts when you answered <em>usually</em> or <em>always</em>. ${s.flags.hsNA?"You marked that you did not attend high school, so that item could not count; your maximum here is effectively 6.":""}</p></div>
    <div class="ledger" style="grid-template-columns:1fr">${ledgerCol("pce",s,"Experiences","--pce","--pce-soft")}</div>`;
  } else {
    body = APPENDIX;
  }
  app.innerHTML = `
  <div class="topbar"><span class="eyebrow">Series XI · Results</span>${themeBtn()}</div>
  <h1 style="font-size:clamp(1.8rem,5vw,2.4rem)">Adverse Childhood Experiences</h1>
  <nav class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab" role="tab" type="button" id="tab-${k}" aria-selected="${S.tab===k}" data-tab="${k}">${l}</button>`).join("")}</nav>
  <div class="stack" style="gap:22px" id="tabbody">${body}</div>
  <div class="row"><button class="btn" id="backBtn" type="button">← Change last answer</button><button class="btn ghost" id="restartBtn" type="button">Start over</button></div>
  ${DISCLAIMER}`;
  bindTheme();
  app.querySelectorAll(".tab").forEach(b => b.onclick = () => { S.tab=b.dataset.tab; render(); });
  document.getElementById("backBtn").onclick = back;
  document.getElementById("restartBtn").onclick = () => { S.a={}; S.i=0; S.screen="intro"; render(); };
}

const APPENDIX = `<div class="appx stack">
<span class="eyebrow">Psychometric appendix</span><h2>Sources, scoring, and decisions</h2>

<h3>Lens 1 · At home (13 items, 10 categories)</h3>
<p>Items are the CDC Behavioral Risk Factor Surveillance System ACE module, 2021–current version, reproduced verbatim with native response options (a U.S. federal work in the public domain). One typographical error in the CDC fact sheet ("you parents") is corrected. Scoring follows CDC rules: <em>Yes</em>, or <em>Once</em>/<em>More than once</em>, counts as exposure; the two substance items combine into one category; the three sexual-abuse items combine into one; <em>Parents not married</em> does not count as separation; the neglect items count when the answer is <em>Never</em> or <em>A little of the time</em>. <em>Don't know</em> and <em>Prefer not to answer</em> count as non-exposure, as in CDC analyses.</p>
<p><b>Published reliability.</b> In 2010 BRFSS data (N≈57,700), the 11 original items gave Cronbach's α = .78 overall; the three factors gave α = .61 (household dysfunction), .70 (emotional/physical abuse) and .80 (sexual abuse), with configural and metric invariance across gender and age (Ford et al., 2014). The neglect items post-date that analysis. Bands (0, 1, 2–3, 4+) follow the convention of the original Kaiser–CDC study (Felitti et al., 1998).</p>

<h3>Lens 2 · Beyond the home (8 items, 7 categories)</h3>
<p>Original items written to the five community domains of the Philadelphia Expanded ACE survey (witnessed violence, discrimination, neighborhood, bullying, foster care; Cronholm et al., 2015), plus two domains from the National Survey of Children's Health ACE list (economic hardship, caregiver death). The Philadelphia wording draws on several copyrighted sources, so these are clean-room items mapped to the construct definitions. Bands (0, 1–2, 3+) follow Philadelphia's convention.</p>
<ul>
<li>Bullying counts only at <em>More than once</em>, because repetition is part of the definition of bullying.</li>
<li>Neighborhood counts if the respondent felt unsafe often or always, <em>or</em> could rarely or never count on neighborhood adults. The second item is reverse-direction, as in Philadelphia's two-item neighborhood measure.</li>
<li>Thresholds for this lens are provisional. These items have no published reliability or norms.</li>
</ul>

<h3>Lens 3 · What held (7 items)</h3>
<p>Positive Childhood Experiences (Bethell et al., 2019), first fielded on the 2015 Wisconsin Behavioral Risk Factor Survey and adapted from the Child and Youth Resilience Measure. Items are phrased as questions with the original content. A PCE counts at <em>usually</em> or <em>always</em>. Published α = .77; factor loadings .57 (felt safe at home) to .72 (family stood by me). Bands 0–2, 3–5, 6–7, with the odds ratios cited in results, are from the same study. Respondents who did not attend high school cannot score item 4; Bethell's handling of that case is not published in the sources consulted, so it is treated as not endorsed and flagged.</p>

<h3>Documented deviations from the series standard</h3>
<ul>
<li><b>No 6-point Likert, no balanced keying.</b> All three lenses are event checklists, scored as cumulative counts. Each item records whether something happened, not a trait, so acquiescence control does not apply in the usual way. Reverse-keying event questions would change what they measure and break comparability with CDC and Bethell norms.</li>
<li><b>No Monte Carlo alpha.</b> A count of distinct events is a formative index: categories are not expected to correlate, and a low α would not mean the score is unreliable. The figures above are published values from source studies. No simulation was run for this instrument.</li>
<li><b>No blind interleaving.</b> Items run in the BRFSS order, which was designed to ease into sensitive content, and the protective items come last so the session ends on what helped.</li>
<li><b>Built-in consistency check.</b> BRFSS item 12 and PCE item 7 ask the same question on different scales. A gap of three or more scale steps raises a note.</li>
<li><b>Retrospective self-report.</b> Prospective studies show adults tend to under-report documented childhood abuse. Scores are best read as a floor.</li>
</ul>

<h3>What the ACE score is not</h3>
<p>The ACE score was built for population surveillance. It does not capture severity, duration, age at onset, or what happened afterward, and two people with the same number can have had very different childhoods. It predicts risk across groups and is a poor predictor for any one person. It is not a diagnosis of anything.</p>

<h3>References</h3>
<ul>
<li>Bethell, C., Jones, J., Gombojav, N., Linkenbach, J., &amp; Sege, R. (2019). Positive childhood experiences and adult mental and relational health in a statewide sample. <em>JAMA Pediatrics, 173</em>(11), e193007.</li>
<li>Centers for Disease Control and Prevention. BRFSS Adverse Childhood Experience (ACE) Module, 2021–Current.</li>
<li>Cronholm, P. F., et al. (2015). Adverse childhood experiences: Expanding the concept of adversity. <em>American Journal of Preventive Medicine, 49</em>(3), 354–361.</li>
<li>Felitti, V. J., et al. (1998). Relationship of childhood abuse and household dysfunction to many of the leading causes of death in adults. <em>American Journal of Preventive Medicine, 14</em>(4), 245–258.</li>
<li>Ford, D. C., et al. (2014). Examination of the factorial structure of adverse childhood experiences and recommendations for three subscale scores. <em>Psychology of Violence, 4</em>(4), 432–444.</li>
<li>Merrick, M. T., et al. (2019). Vital Signs: Estimated proportion of adult health problems attributable to adverse childhood experiences. <em>MMWR, 68</em>(44), 999–1005.</li>
</ul>
</div>`;

function render(){
  if (S.screen==="intro") renderIntro();
  else if (S.screen==="q") renderQ();
  else renderResults();
  try{ window.scrollTo(0,0); }catch(e){}
}

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.screen==="q"){
    const n = parseInt(e.key,10), opts = SETS[ITEMS[S.i].set];
    if (n>=1 && n<=opts.length){ e.preventDefault(); choose(opts[n-1][1]); }
    else if (e.key==="Backspace"){ e.preventDefault(); back(); }
  } else if (S.screen==="results" && e.key==="Backspace" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); back(); }
});

render();
})();
</script>
