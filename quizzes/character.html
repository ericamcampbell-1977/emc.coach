<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Series VII · Character</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --paper:#F5F0E6; --sheet:#FBF8F2; --sheet2:#F4EEE2; --ink:#2A2421; --muted:#6E625B; --faint:#998D80; --rule:#DED4C6; --rule2:#E9E1D3;
  --vsp:#9A6A1F; --vsp-soft:#ECE0C7; --dti:#8C3B45; --dti-soft:#EBD6D8; --lti:#476653; --lti-soft:#D8E3D9; --hhp:#3F566B; --hhp-soft:#D6DEE6;
  --ac:var(--vsp); --ac-soft:var(--vsp-soft); --shadow:0 1px 2px rgba(42,36,33,.05),0 10px 30px rgba(42,36,33,.06);
  --display:"Fraunces",Georgia,"Times New Roman",serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1B1715; --sheet:#241F1C; --sheet2:#2B2521; --ink:#EDE5D9; --muted:#A99C91; --faint:#847568; --rule:#3B332E; --rule2:#322B26;
  --vsp:#D9A75A; --vsp-soft:#3A3020; --dti:#E09AA3; --dti-soft:#43282C; --lti:#93BBA0; --lti-soft:#26352B; --hhp:#8FB0C6; --hhp-soft:#223038;
  --ac:var(--vsp); --ac-soft:var(--vsp-soft); --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#1B1715; --sheet:#241F1C; --sheet2:#2B2521; --ink:#EDE5D9; --muted:#A99C91; --faint:#847568; --rule:#3B332E; --rule2:#322B26;
  --vsp:#D9A75A; --vsp-soft:#3A3020; --dti:#E09AA3; --dti-soft:#43282C; --lti:#93BBA0; --lti-soft:#26352B; --hhp:#8FB0C6; --hhp-soft:#223038;
  --ac:var(--vsp); --ac-soft:var(--vsp-soft); --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:500;letter-spacing:-.01em;margin:0}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--ac);outline-offset:3px;border-radius:3px}
.wrap{max-width:820px;margin:0 auto}

header.top{border-bottom:1px solid var(--rule);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:14px;height:56px}
.brand{font-family:var(--display);font-size:17px;font-weight:600;white-space:nowrap}
.brand .no{font-family:var(--mono);font-size:12px;color:var(--faint);font-weight:400;margin-right:7px;letter-spacing:.05em}
.tabs{display:flex;gap:1px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:none;color:var(--muted);font-size:13px;font-weight:500;padding:7px 10px;border-radius:7px;white-space:nowrap;position:relative;display:flex;align-items:center;gap:5px}
.tab:hover{color:var(--ink);background:var(--sheet2)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-9px;height:2px;background:var(--td,var(--ink));border-radius:2px}
.tab small{font-family:var(--mono);font-size:10px;color:var(--tc,var(--faint))}

main{padding-bottom:40px}
section.view{display:none;padding:38px 0 60px;animation:fade .3s ease}
section.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.hero .eyebrow{margin-bottom:18px}
.hero h1{font-size:clamp(30px,6vw,46px);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.hero h1 em{font-style:italic;color:var(--vsp)}
.lede{font-size:18px;color:var(--muted);margin:20px 0 0;max-width:60ch;line-height:1.55}
.grain{height:1px;background:linear-gradient(90deg,var(--rule),transparent);margin:34px 0}
.lenses{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.lens{background:var(--sheet);border:1px solid var(--rule2);border-left:3px solid var(--ac);border-radius:12px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s,background .15s}
.lens:hover{transform:translateY(-2px);background:color-mix(in srgb,var(--ac-soft) 45%,var(--sheet))}
.lens .code{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ac);text-transform:uppercase}
.lens h3{font-size:20px}
.lens p{margin:0;font-size:13.5px;color:var(--muted)}
.lens .facets{font-family:var(--mono);font-size:11px;color:var(--faint);line-height:1.7}
.lens .go{margin-top:4px;font-size:13px;font-weight:600;color:var(--ac)}
.lens .st{font-family:var(--mono);font-size:10.5px;color:var(--lti);letter-spacing:.05em}
.note{background:var(--sheet2);border:1px solid var(--rule2);border-left:3px solid var(--faint);border-radius:8px;padding:15px 17px;margin:26px 0 0;font-size:13.5px;color:var(--muted);line-height:1.55}
.note b{color:var(--ink);font-weight:600}

.intro .eyebrow{margin-bottom:14px}
.intro h2{font-size:clamp(26px,5vw,36px);line-height:1.08}
.intro .sub{color:var(--muted);font-size:16.5px;margin:16px 0 0;max-width:62ch}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 0}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--muted);background:var(--sheet);border:1px solid var(--rule2);border-radius:20px;padding:6px 12px}
.startbtn{margin-top:30px;background:var(--ink);color:var(--paper);border:none;border-radius:10px;padding:14px 26px;font-size:15px;font-weight:600;box-shadow:var(--shadow)}
.startbtn:hover{opacity:.92}
.subscales{margin-top:26px;display:grid;gap:0}
.subrow{display:flex;align-items:baseline;gap:12px;font-size:14px;padding:11px 0;border-top:1px solid var(--rule2)}
.subrow .k{font-family:var(--mono);font-size:11px;color:var(--ac);width:22px;flex:none}
.subrow .n{font-weight:600;min-width:150px}
.subrow .d{color:var(--muted);font-size:13px}

.q-stage{min-height:62vh;display:flex;flex-direction:column}
.qbar{height:3px;background:var(--rule2);border-radius:3px;overflow:hidden}
.qbar>i{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .3s ease}
.qcount{font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.08em;margin:12px 0 0;display:flex;justify-content:space-between}
.qcard{flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 0}
.qtext{font-family:var(--display);font-size:clamp(23px,4.6vw,31px);line-height:1.3;max-width:24ch;text-wrap:balance}
.scale{margin-top:30px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;max-width:560px}
.opt{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;background:var(--sheet);border:1.5px solid var(--rule2);border-radius:10px;padding:13px 5px 11px;color:var(--ink);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--ac)}
.opt .num{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--muted)}
.opt .lab{font-size:10.5px;line-height:1.25;color:var(--muted)}
.opt[aria-pressed="true"]{background:var(--ac-soft);border-color:var(--ac)}
.opt[aria-pressed="true"] .num{color:var(--ac)}
@media(max-width:520px){.scale{grid-template-columns:repeat(3,minmax(0,1fr))}}
.qnav{display:flex;gap:14px;align-items:center;margin-top:26px}
.backbtn{background:none;border:none;color:var(--muted);font-size:13px;font-weight:500;padding:6px 2px}
.backbtn:hover{color:var(--ink)}
.backbtn[disabled]{opacity:.35;cursor:default}
.khint{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}

.res .eyebrow{margin-bottom:12px}
.res h2{font-size:clamp(24px,5vw,34px)}
.res .headline{font-family:var(--display);font-size:19px;color:var(--muted);margin:14px 0 0;line-height:1.5;max-width:60ch}
.res .headline b{color:var(--ink)}
.panel{background:var(--sheet);border:1px solid var(--rule2);border-radius:13px;padding:22px;margin-top:22px;box-shadow:var(--shadow)}
.cap{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:16px}
.barrow{display:grid;grid-template-columns:132px 1fr 92px;align-items:center;gap:12px;padding:7px 0}
.barrow .lab{font-size:13.5px;font-weight:500}
.barrow .track{height:9px;background:var(--rule2);border-radius:6px;position:relative;overflow:hidden}
.barrow .track>i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--ac);transition:width .6s cubic-bezier(.2,.7,.2,1)}
.barrow .rt{display:flex;justify-content:flex-end;gap:8px;align-items:baseline}
.barrow .val{font-family:var(--mono);font-size:12px;color:var(--ink)}
.barrow .band{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.03em}
.composite{border-top:1px dashed var(--rule);margin-top:12px;padding-top:12px}
.radar-wrap{display:flex;justify-content:center;padding:4px 0 10px}
.rankgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
@media(max-width:560px){.rankgrid{grid-template-columns:1fr}}
.rankrow{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 0;border-top:1px solid var(--rule2)}
.rankrow .r{font-family:var(--mono);font-size:11px;color:var(--faint);width:20px}
.rankrow .nm{flex:1}
.rankrow .vr{font-family:var(--mono);font-size:11px;color:var(--muted)}
.rankrow.sig .nm{color:var(--ac);font-weight:600}
.rankrow.sig .r{color:var(--ac)}
.readblock{margin-top:20px}
.readblock p{font-size:14.5px;color:var(--muted);line-height:1.6;margin:0 0 12px}
.readblock p b{color:var(--ink);font-weight:600}
.care{background:var(--dti-soft);border:1px solid var(--rule2);border-left:3px solid var(--dti);border-radius:8px;padding:15px 17px;margin-top:20px;font-size:13.5px;color:var(--ink);line-height:1.55}
.care b{font-weight:600}
.retake{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.ghostbtn{background:none;border:1px solid var(--rule);color:var(--muted);border-radius:10px;padding:11px 18px;font-size:13.5px;font-weight:500}
.ghostbtn:hover{border-color:var(--ink);color:var(--ink)}

.locked{text-align:center;padding:48px 20px;color:var(--muted)}
.locked .big{font-family:var(--display);font-size:24px;color:var(--ink);margin-bottom:10px;text-wrap:balance}
.dots{display:flex;gap:8px;justify-content:center;margin-top:20px}
.dots span{width:9px;height:9px;border-radius:50%;background:var(--rule)}
.dots span.on{background:var(--ink)}
.quad{position:relative;width:100%;max-width:420px;aspect-ratio:1;margin:8px auto 28px;border:1px solid var(--rule);border-radius:12px;background:var(--sheet);
  background-image:linear-gradient(var(--rule2),var(--rule2)),linear-gradient(var(--rule2),var(--rule2));background-size:1px 100%,100% 1px;background-position:50% 0,0 50%;background-repeat:no-repeat}
.quad .qlab{position:absolute;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--faint);text-transform:uppercase;padding:9px;line-height:1.3}
.quad .tl{top:0;left:0}.quad .tr{top:0;right:0;text-align:right}.quad .bl{bottom:0;left:0}.quad .br{bottom:0;right:0;text-align:right}
.quad .axl{position:absolute;font-family:var(--mono);font-size:10px;color:var(--muted)}
.quad .ax-x{bottom:-22px;right:4px}.quad .ax-y{top:-20px;left:0}
.quad .pt{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--paper);transform:translate(-50%,50%);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.crossrow{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--rule2)}
.crossrow .ic{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none;width:66px;padding-top:2px;letter-spacing:.03em}
.crossrow .bd{font-size:14px;color:var(--muted);line-height:1.55}
.crossrow .bd b{color:var(--ink);font-weight:600}

.appx h2{font-size:28px}
.appx h3{font-family:var(--body);font-weight:600;font-size:14px;margin:26px 0 8px;letter-spacing:.01em}
.appx p,.appx li{font-size:14px;color:var(--muted);line-height:1.62}
.appx ul{padding-left:18px;margin:6px 0}
.appx li{margin:4px 0}
.appx .cite{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.tblwrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:460px}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--rule2)}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:400}
td.n{font-family:var(--mono);color:var(--ink)}

.legal{border-top:1px solid var(--rule);margin-top:10px;padding:26px 0 10px}
.legal .lh{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.legal p{font-size:11.5px;line-height:1.6;color:var(--faint);margin:0 0 8px;max-width:88ch}
.footer{padding:18px 0 46px;color:var(--faint);font-size:11px;font-family:var(--mono);letter-spacing:.03em}

.share{margin-top:28px;background:var(--sheet);border:1px solid var(--rule2);border-radius:13px;padding:22px;box-shadow:var(--shadow)}
.share h3{font-family:var(--display);font-weight:500}
.field{display:grid;gap:6px;margin:12px 0}
.field label{font-size:13px;font-weight:600}
.field input[type=email]{font:inherit;padding:10px 12px;border:1px solid var(--rule);border-radius:7px;background:var(--paper);color:var(--ink);width:100%;max-width:420px}
.field input[type=email]:focus-visible{outline:2.5px solid var(--ac);outline-offset:1px}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:14px;max-width:66ch;cursor:pointer}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--ac);flex:none}
.consent{font-size:12.5px;color:var(--muted);margin:-4px 0 10px 28px;max-width:60ch}
.addr{font-family:var(--mono);font-size:12.5px;color:var(--ac);user-select:all;word-break:break-all}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.status{font-size:13px;margin-top:12px;min-height:1.3em;color:var(--muted)}
.status.err{color:var(--dti)}
details.preview{margin-top:14px}
details.preview summary{cursor:pointer;font-size:13px;color:var(--muted)}
details.preview pre{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12px;background:var(--paper);border:1px solid var(--rule2);border-radius:7px;padding:12px;max-height:340px;overflow:auto;user-select:all;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:560px){.barrow{grid-template-columns:100px 1fr 80px}.brand .full{display:none}}
</style>
</head>

<header class="top"><div class="wrap">

</div></header>
<main class="wrap" id="main"></main>
<div class="wrap">

const ORDER_K=["VSP","DTI","LTI","HHP"];
const SCALE=[["Strongly disagree",1],["Disagree",2],["Slightly disagree",3],["Slightly agree",4],["Agree",5],["Strongly agree",6]];
const BANDS=[[1,2,"Very low"],[2,3,"Low"],[3,4,"Moderate"],[4,5,"High"],[5,6.001,"Very high"]];
function bandOf(m){for(const[a,b,l]of BANDS)if(m>=a&&m<b)return l;return"—";}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* deterministic blind interleave: round-robin across subscales, never two adjacent from one subscale */
function buildQueue(inst){
  const subs=BANK[inst].subs, keys=Object.keys(subs);
  const cols=keys.map(k=>subs[k].items.map((it,i)=>({...it,sub:k,idx:i,id:inst+"."+k+"."+i})));
  const q=[]; let r=0, more=true;
  while(more){ more=false; for(const c of cols){ if(r<c.length){ q.push(c[r]); more=true; } } r++; }
  return q;
}
const ORDER=Object.fromEntries(ORDER_K.map(k=>[k,buildQueue(k)]));

function scoreSub(inst,sub){
  const items=BANK[inst].subs[sub].items; let sum=0,n=0;
  items.forEach((it,i)=>{const raw=STATE.ans[inst][inst+"."+sub+"."+i]; if(raw==null)return; sum+=it.rev?7-raw:raw; n++;});
  return n===items.length ? sum/n : null;
}
function scoreAll(inst){const o={}; Object.keys(BANK[inst].subs).forEach(s=>o[s]=scoreSub(inst,s)); return o;}
function composite(inst){const v=Object.values(scoreAll(inst)); return v.reduce((a,b)=>a+b,0)/v.length;}
function scoreStrength(){
  const map={};
  Object.keys(BANK.VSP.subs).forEach(sub=>BANK.VSP.subs[sub].items.forEach((it,i)=>{
    const raw=STATE.ans.VSP["VSP."+sub+"."+i]; if(raw==null)return;
    const v=it.rev?7-raw:raw; (map[it.s]=map[it.s]||[]).push(v);
  }));
  return Object.keys(map).map(s=>({s,m:map[s].reduce((a,b)=>a+b,0)/map[s].length,n:map[s].length})).sort((a,b)=>b.m-a.m);
}
function instComplete(inst){return ORDER[inst].every(o=>STATE.ans[inst][o.id]!=null);}
function answered(inst){return ORDER[inst].filter(o=>STATE.ans[inst][o.id]!=null).length;}

function answer(inst,v){
  const q=ORDER[inst],p=Math.min(STATE.pos[inst],q.length-1);
  STATE.ans[inst][q[p].id]=v;
  if(p>=q.length-1 && instComplete(inst)){STATE.phase[inst]="done";}
  else{STATE.pos[inst]=p+1; if(STATE.pos[inst]>=q.length){const nx=q.findIndex(x=>STATE.ans[inst][x.id]==null); STATE.pos[inst]=nx<0?q.length-1:nx;}}
  save(); render();
}
function back(inst){if(STATE.pos[inst]>0){STATE.pos[inst]--;save();render();}}
document.addEventListener('keydown',e=>{
  const t=STATE.tab; if(!ORDER_K.includes(t)||STATE.phase[t]!=="q")return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[1-6]$/.test(e.key)){e.preventDefault();answer(t,+e.key);}
  else if(e.key==="Backspace"){e.preventDefault();back(t);}
});

/* ---------- visuals ---------- */
function svgRadar(vals,labels){
  const N=vals.length,cx=150,cy=140,R=104,grid=[];
  for(let ring=1;ring<=3;ring++){const rr=R*ring/3;let p="";for(let i=0;i<N;i++){const a=-Math.PI/2+i*2*Math.PI/N;p+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1)+' ';}grid.push(`<path d="${p}Z" fill="none" stroke="var(--rule)" stroke-width="1"/>`);}
  let poly="",dots="",labs="";
  for(let i=0;i<N;i++){const a=-Math.PI/2+i*2*Math.PI/N,rr=R*((vals[i]-1)/5),x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);
    poly+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' '; dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="var(--ac)"/>`;
    const lx=cx+(R+20)*Math.cos(a),ly=cy+(R+20)*Math.sin(a),anch=Math.abs(Math.cos(a))<.3?'middle':(Math.cos(a)>0?'start':'end');
    labs+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anch}" font-family="IBM Plex Mono,monospace" font-size="10.5" fill="var(--muted)">${labels[i]}</text>`;
    grid.push(`<line x1="${cx}" y1="${cy}" x2="${(cx+R*Math.cos(a)).toFixed(1)}" y2="${(cy+R*Math.sin(a)).toFixed(1)}" stroke="var(--rule2)" stroke-width="1"/>`);}
  return `<svg viewBox="0 0 300 280" width="300" height="280" role="img" aria-label="virtue profile">${grid.join('')}<path d="${poly}Z" fill="var(--ac)" fill-opacity="0.16" stroke="var(--ac)" stroke-width="2"/>${dots}${labs}</svg>`;
}
function bar(lab,m,band){return `<div class="barrow"><span class="lab">${lab}</span><span class="track"><i style="width:${((m-1)/5*100).toFixed(0)}%"></i></span><span class="rt"><span class="val">${m.toFixed(2)}</span>${band?`<span class="band">${band}</span>`:''}</span></div>`;}

function topName(sc){return sc.slice().sort((a,b)=>b.m-a.m)[0].k;}
function lowName(sc){return sc.slice().sort((a,b)=>a.m-b.m)[0].k;}
function headline(inst,sc){const hi=topName(sc),lo=lowName(sc);return ({
  VSP:`Your strongest virtue reads as <b>${hi}</b>, your quietest as <b>${lo}</b>. Character isn't one score — it's this shape.`,

function readCopy(inst){return ({

/* ---------- appendix ---------- */
function appendix(){
  const rows=ORDER_K.flatMap(c=>Object.keys(BANK[c].subs).map(s=>{
    const items=BANK[c].subs[s].items,a=(ALPHA[c]||{})[s]||{};
    return `<tr><td class="n">${c}</td><td>${s}</td><td class="n">${items.length}</td><td class="n">${items.filter(i=>!i.rev).length}F / ${items.filter(i=>i.rev).length}R</td><td class="n">${a.mean!=null?a.mean.toFixed(3):'–'}</td><td class="n">${a.p05!=null?a.p05.toFixed(3):'–'}</td></tr>`;
  })).join('');
  const tot=ORDER_K.reduce((a,c)=>a+ORDER[c].length,0),nsub=ORDER_K.reduce((a,c)=>a+Object.keys(BANK[c].subs).length,0);
  M.innerHTML=`<section class="view active appx"><div class="eyebrow">Method &amp; psychometrics</div>
    <h2 style="margin-top:10px">How this suite is built — and where it stops</h2>
    <p style="margin-top:14px">Series VII covers four construct families in ${tot} items across ${nsub} subscales. Every item is <b>clean-room</b>: original wording composed to each construct's published definition, so nothing here reproduces a copyrighted instrument. That keeps the suite free to publish, but it also means these are <b>adaptations, not the validated scales</b> — scores can't be read against published norms or cutoffs, and the reliabilities below are simulated, not established on human samples.</p>
    <div class="tblwrap"><table><thead><tr><th>Code</th><th>Subscale</th><th>Items</th><th>Keying</th><th>α mean</th><th>α 5th pct</th></tr></thead><tbody>${rows}</tbody></table></div>
    <h3>Response format &amp; keying</h3>
    <p>A house 6-point forced-choice agreement scale with no neutral midpoint. Each subscale runs <b>3 forward / 3 reverse</b> items, blind-interleaved across subscales. Reverse items are scored 7 − x. Straight-line agreement on every item lands a subscale at the <b>3.50 midpoint</b>, not the top band, so acquiescence can't masquerade as a high score. The four source scales natively use 5-point formats; the shift to the house 6-point is a documented deviation, taken because clean-room items already forgo item-level norm comparability and the forced choice buys a cleaner acquiescence check in return.</p>
    <h3>VSP — the hybrid</h3>
    <p>VIA's 24-strength granularity is incompatible with 6-item balanced keying, so the instrument works on two levels. The <b>six virtues</b> are each scored from a balanced 6-item subscale and banded — the psychometrically defensible layer. The <b>24 strengths</b> are then ranked from those same items (1–2 items each, reverse-scored where negatively worded) as an <b>exploratory signature ranking</b>, explicitly not a measurement. Single-item strengths are flagged. One consequence worth stating: because those single-item strengths aren't keying-balanced, the ranking — unlike the six virtue scores — isn't fully acquiescence-proof, so a straight-line yea-sayer would float the forward-worded strengths upward. The virtue layer stays immune; the strength ranking is a softer signal.</p>
    <h3>Reliability (simulated)</h3>
    <p>The α figures come from a Monte-Carlo simulation (N = 1,400 synthetic respondents per subscale, 200 runs) using a one-factor model per subscale — forward loadings drawn from .60–.85, reverse from .50–.75, responses cut to six ordinal points and reverse items rescored. They indicate whether the item <i>structure</i> coheres, not how the items would behave in real people.</p>
    <h3>Documented judgement calls</h3>
    <ul>
      <li><b>Tetrad, not triad.</b> DTI extends the SD3 triad with everyday sadism, the fourth dark trait, for a fuller shadow map.</li>
      <li><b>VIA's virtue structure is contested.</b> The 24→6 grouping doesn't cleanly replicate factor-analytically (Brdar &amp; Kashdan, 2009; McGrath's 3- and 5-factor revisions). The six virtues are retained as an organising frame, not a validated latent structure.</li>
      <li><b>SD3 item-saturation critique.</b> The dark items lean on constructs whose short-scale operationalisation has been questioned (Latham &amp; Stephenson, 2025), especially psychopathy.</li>
      <li><b>The Light Triad is a first-draft measure.</b> Kaufman et al. describe the LTS as preliminary; treat the light lens as the least settled of the four.</li>
      <li><b>Light and dark are not mirror images.</b> They correlate only modestly and negatively, so the Synthesis treats "high on both" as a real profile rather than a contradiction.</li>
    </ul>
    <h3>Where it stops</h3>
    <p>This is a reflective self-assessment, not a diagnosis, a screen, or a hiring or forensic tool. Character self-report is uniquely prone to self-favourable distortion; the strongest available check is observer report, which remains the natural next build — most of all for the dark and light lenses, where the gap between self-image and how others experience a person is widest.</p>
    <p class="cite" style="margin-top:22px">Constructs: Peterson &amp; Seligman (2004) · Jones &amp; Paulhus (2014) · Paulhus / Buckels et al. (everyday sadism) · Kaufman, Yaden, Hyde &amp; Tsukayama (2019) · Ashton &amp; Lee (HEXACO). Items original to Series VII.</p>
  </section>`;
}

function synthRows(){
  const S={}; ORDER_K.forEach(c=>{if(instComplete(c))S[c]=scoreAll(c);});
  const mean=o=>{const v=Object.values(o);return v.reduce((a,b)=>a+b,0)/v.length;};
  const light=S.LTI?mean(S.LTI):null,dark=S.DTI?mean(S.DTI):null,hh=S.HHP?mean(S.HHP):null;
  const rows=[];
  if(light!=null&&dark!=null){const gap=light-dark;rows.push(["L − D",`Your light runs <b>${gap>=0?'+':''}${gap.toFixed(2)}</b> against your dark. ${gap>1?'A clear prosocial lean.':gap<-0.5?'The antagonistic side is currently louder — worth sitting with rather than explaining away.':'A genuinely mixed profile: both are present at working strength.'}`]);}
  if(hh!=null&&dark!=null){rows.push(["HH ↔ D",`Honesty–Humility (<b>${hh.toFixed(2)}</b>) is the personality strand most cleanly opposed to the dark core (<b>${dark.toFixed(2)}</b>). ${hh+dark<6.4?'Both low-to-mid — a pragmatic, low-scruple lean worth noting.':hh>dark?'They point the expected opposite ways, which is the coherent pattern.':'Dark sits above your integrity grain here — the one tension most worth examining.'}`]);}
  if(S.VSP&&hh!=null){const hum=(S.VSP.Humanity+S.VSP.Justice)/2;rows.push(["VSP ↔ HH",`Your other-facing virtues (Humanity + Justice, <b>${hum.toFixed(2)}</b>) and Honesty–Humility (<b>${hh.toFixed(2)}</b>) are two independent roads to the same moral territory. ${Math.abs(hum-hh)<0.6?'They agree — a convergent, credible read.':'They diverge a little, which is where self-report is most worth a second opinion.'}`]);}
  if(S.VSP){const rank=scoreStrength();rows.push(["Signature",`Across everything, the strengths you lead with are <b>${rank.slice(0,3).map(r=>r.s.toLowerCase()).join(", ")}</b>. Those are the levers most likely to move your own behaviour.`]);}
  rows.push(["Caution",`Every score here is self-report on a topic where almost no one is a neutral witness to themselves. The reverse-keying discounts straight-line agreement, but the real check on character is <b>how others experience you</b> — an observer form is the natural next build, most of all for the dark and light lenses.`]);
  return rows;
}
